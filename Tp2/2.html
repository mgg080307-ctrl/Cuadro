<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>/*Permitir al usuario ingresar un número entero. En cualquier caso indicar si ingresó
un número positivo, negativo o 0.*/
        let numero = parseInt(prompt('ingresa un número entero'));
        if (numero > 0) {
            alert('El número que pusiste es positivo');
        } else if (numero < 0) {
            alert('El número que pusiste es negativo');
        } else {
            alert('El número que pusiste es 0');
        }
    </script>
</body>
</html>
