<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>/*Pedir al usuario que ingrese un número entre 10 y 20. verificar que el usuario haya
ingresado un valor dentro de ese intervalo. En ese caso, emita un mensaje: “ud. ha
ganado”. En caso contrario el mensaje será: “ud. no ha ingresado un valor dentro del
rango solicitado”*/
        let numero = parseFloat(prompt('Pone un número entre 10 y 20'));
        if (numero >= 10 && numero <= 20) {
            alert('ud. ha ganado');
        } else {
            alert('ud. no ha ingresado un valor dentro del rango solicitado');
        }
    </script>
</body>
</html>
