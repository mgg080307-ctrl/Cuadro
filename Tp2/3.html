<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>/*Ingresar los tres lados de un triángulo. Determinar si el mismo es isósceles,
equilátero o escaleno.*/
        let lado1 = parseFloat(prompt('Ingresa la medida del primer lado'));
        let lado2 = parseFloat(prompt('Ingresa la medida del segundo lado'));
        let lado3 = parseFloat(prompt('Ingresa la medida del tercer lado'));

        if (lado1 === lado2 && lado2 === lado3) {
            alert('El triángulo es equilátero');
        } else if (lado1 === lado2 || lado1 === lado3 || lado2 === lado3) {
            alert('El triángulo es isósceles');
        } else {
            alert('El triángulo es escaleno');
        }
    </script>
</body>
</html>
