<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*Ejercicion 1
        Solicitar al usuario 2 numeros y calcular el producto de ambos. Mostrar todos los valores.*/
        let nro1 = parseInt(prompt('Ingresa el primer numero'));
        let nro2 = parseInt(prompt('Ingresa el segundo numero'));
        let producto = nro1 * nro2;
        alert('los numeros ingresados fueron ' + nro1 + ' y ' + nro2 + ' el producto de ambos es ' + producto)
    </script>
</body>
</html>
